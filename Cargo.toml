[workspace]
resolver = "2"
members = [
  "crates/burn_image",
  "crates/burn_qwen3_vl",
  "crates/burn_flux_vae",
  "crates/burn_boogu",
  "crates/bevy_image",
]
exclude = ["patches/wgpu-29.0.4", "patches/cubecl-wgpu-0.10.0"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_image"
repository = "https://github.com/mosure/burn_image"
readme = "README.md"
keywords = ["burn", "image-generation", "webgpu", "diffusion"]
categories = ["computer-vision", "multimedia::images", "science"]

[workspace.dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
burn-cubecl = { version = "=0.21.0", default-features = false }
burn-cuda = { version = "=0.21.0", default-features = false }
burn-core = { version = "=0.21.0", default-features = false, features = ["std"] }
burn-fusion = { version = "=0.21.0", default-features = false }
burn-ir = { version = "=0.21.0", default-features = false }
burn-ndarray = { version = "=0.21.0", default-features = false, features = ["std", "simd", "multi-threads"] }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "safetensors", "burnpack", "memmap"] }
burn-wgpu = { version = "=0.21.0", default-features = false }
cubek = { version = "=0.2.0", default-features = false }
bevy = { version = "=0.19.0", default-features = false }
bevy_burn = { version = "=0.5.0", default-features = false }
bevy_egui = { version = "=0.41.1", default-features = false }
bevy_pancam = { version = "=0.21.0", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
half = { version = "2.7", features = ["bytemuck", "serde"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
js-sys = "0.3"
memmap2 = "0.9"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rfd = { version = "0.17", default-features = false, features = ["wayland", "xdg-portal"] }
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
tracing = "0.1"
ureq = "2.12"
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wgpu = "=29.0.4"

[patch.crates-io]
# Chrome/Dawn may route large WebGPU writeBuffer calls through an unstable shared-memory transport.
# The vendored WebGPU backend splits browser uploads into bounded JS calls.
wgpu = { path = "patches/wgpu-29.0.4" }
# A CubeCL synchronization following an upload-only model shard must submit pending wgpu writes
# even when no compute task has been queued. New shader modules/layouts/pipelines and every bounded
# WGPU task/write batch are wrapped in validation, out-of-memory, and internal error scopes whose
# results are drained by the next sync. These make sync a truthful upload/computation boundary
# without disabling bounded task batching. Runtime limits and optional execution features are
# taken from the logical device for the WGSL/browser path, including a non-blocking Wasm path for
# ordinary inference when device timestamp queries are unavailable.
cubecl-wgpu = { path = "patches/cubecl-wgpu-0.10.0" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.test]
# The combined Burn, CubeCL, and Bevy graph otherwise produces a very large
# debug-info link on hosted CI runners. Tests do not require debug symbols.
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.wasm-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
