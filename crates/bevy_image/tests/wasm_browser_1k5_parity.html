<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>burn-image-1k5-parity-running</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #090b0f;
        color: #dce9e3;
      }

      body {
        margin: 0;
        padding: 1rem;
      }

      #status {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #burn-image-headless-result {
        display: block;
        max-width: min(100%, 1536px);
        height: auto;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <pre id="status" role="status" aria-live="polite">BURN_IMAGE_HEADLESS_STARTING</pre>
    <script type="module">
      const status = document.querySelector("#status");
      const vaeReference = new URLSearchParams(location.search).get("headless") === "vae-reference";
      const terminal = vaeReference
        ? {
            ok: "BURN_IMAGE_HEADLESS_VAE_REFERENCE_OK ",
            failed: "BURN_IMAGE_HEADLESS_VAE_REFERENCE_FAILED",
            title: "burn-image-1k5-vae-reference",
          }
        : {
            ok: "BURN_IMAGE_HEADLESS_PARITY_OK ",
            failed: "BURN_IMAGE_HEADLESS_PARITY_FAILED",
            title: "burn-image-1k5-parity",
          };
      status.textContent = vaeReference
        ? "BURN_IMAGE_HEADLESS_VAE_REFERENCE_STARTING"
        : "BURN_IMAGE_HEADLESS_PARITY_STARTING";
      const state = {
        ok: false,
        stage: "starting",
        report: null,
        error: null,
        webgpu_calls: [],
      };
      globalThis.__burnImageHeadlessParity = state;
      globalThis.__burnImageHeadlessVaeReference = vaeReference ? state : null;

      const recordWebGpu = (event, detail = null) => {
        state.webgpu_calls.push({ event, at_ms: performance.now(), detail });
      };
      try {
        const gpu = navigator.gpu;
        if (!gpu) {
          recordWebGpu("navigator-gpu-unavailable");
        } else {
          const requestAdapter = gpu.requestAdapter.bind(gpu);
          Object.defineProperty(gpu, "requestAdapter", {
            configurable: true,
            value: async (options) => {
              recordWebGpu("request-adapter-start", structuredClone(options ?? null));
              try {
                const adapter = await requestAdapter(options);
                const adapterInfoSource = adapter?.info ?? null;
                const adapterInfo = adapter
                  ? {
                      is_fallback_adapter:
                        (typeof adapter.isFallbackAdapter === "boolean"
                          ? adapter.isFallbackAdapter
                          : null) ??
                        (typeof adapterInfoSource?.isFallbackAdapter === "boolean"
                          ? adapterInfoSource.isFallbackAdapter
                          : null),
                      vendor: adapterInfoSource?.vendor ?? null,
                      architecture: adapterInfoSource?.architecture ?? null,
                      device: adapterInfoSource?.device ?? null,
                      description: adapterInfoSource?.description ?? null,
                    }
                  : null;
                recordWebGpu("request-adapter-resolved", {
                  available: adapter !== null,
                  info: adapterInfo,
                });
                if (adapterInfo?.is_fallback_adapter === true) {
                  throw new Error("WebGPU returned a fallback adapter");
                }
                if (adapter) {
                  try {
                    const prototype = Object.getPrototypeOf(adapter);
                    if (!prototype.__burnImage1k5RequestDeviceInstrumented) {
                      const requestDevice = prototype.requestDevice;
                      Object.defineProperty(prototype, "requestDevice", {
                        configurable: true,
                        value: async function (descriptor) {
                          const summary = {
                            requiredFeatures: [...(descriptor?.requiredFeatures ?? [])],
                            requiredLimits: { ...(descriptor?.requiredLimits ?? {}) },
                          };
                          recordWebGpu("request-device-start", summary);
                          try {
                            const device = await requestDevice.call(this, descriptor);
                            recordWebGpu("request-device-resolved", summary);
                            return device;
                          } catch (error) {
                            recordWebGpu("request-device-rejected", {
                              ...summary,
                              error: String(error),
                            });
                            throw error;
                          }
                        },
                      });
                      Object.defineProperty(
                        prototype,
                        "__burnImage1k5RequestDeviceInstrumented",
                        { value: true },
                      );
                    }
                  } catch (error) {
                    recordWebGpu("request-device-instrumentation-unavailable", {
                      error: String(error),
                    });
                  }
                }
                return adapter;
              } catch (error) {
                recordWebGpu("request-adapter-rejected", { error: String(error) });
                throw error;
              }
            },
          });
        }
      } catch (error) {
        recordWebGpu("instrumentation-unavailable", { error: String(error) });
      }

      const synchronizeState = () => {
        const message = status?.textContent ?? "";
        if (message.startsWith(terminal.ok)) {
          state.ok = true;
          state.stage = "complete";
          try {
            state.report = JSON.parse(message.slice(terminal.ok.length));
          } catch (error) {
            state.ok = false;
            state.stage = "failed";
            state.error = `invalid success report JSON: ${error}`;
          }
        } else if (message.startsWith(terminal.failed)) {
          state.ok = false;
          state.stage = "failed";
          state.error = message;
        }
        document.title = `${terminal.title}-${state.stage}`;
      };
      new MutationObserver(synchronizeState).observe(status, {
        childList: true,
        characterData: true,
        subtree: true,
      });

      try {
        const { default: init } = await import("/app/out/bevy_burn_image.js");
        await init();
        synchronizeState();
      } catch (error) {
        const detail = error instanceof Error ? error.stack ?? error.message : String(error);
        status.textContent = `${terminal.failed} browser initialization: ${detail}`;
        synchronizeState();
        console.error(error);
      }
    </script>
  </body>
</html>
