name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: report deployment readiness
        shell: bash
        env:
          AUTOMATIC_DEPLOYMENT_ENABLED: ${{ vars.BURN_IMAGE_PAGES_READY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "Manual deployment requested; the deploy job will verify every external prerequisite."
          elif [[ "$AUTOMATIC_DEPLOYMENT_ENABLED" == true ]]; then
            echo "Automatic Pages deployment is enabled."
          else
            echo "Pages deployment is gated until BURN_IMAGE_PAGES_READY=true."
            echo "Publish the canonical CDN bundle and enable Pages with GitHub Actions first."
          fi

  deploy:
    needs: readiness
    if: github.event_name == 'workflow_dispatch' || vars.BURN_IMAGE_PAGES_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: verify canonical browser CDN contract
        shell: bash
        env:
          MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-turbo
          MODEL_CONTENT_DIGEST: 555019af867a80bb4d7cec5dc2f0ba60ae799071994a5fd24d7e71918cb9ce36
          EDIT_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-edit-turbo
          EDIT_MODEL_CONTENT_DIGEST: 28b1b51f2fb152557b11a9f0ef8e872ae7d163bcab7abd42f9eaf4bfef10e7aa
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          manifest_file="$scratch/parent.json"
          model_root_url="${MODEL_BASE_URL%/*}"

          fetch_manifest() {
            local url="$1"
            local output="$2"
            local headers="$3"

            curl --fail --silent --show-error \
              --output "$output" \
              --dump-header "$headers" \
              --header 'Origin: https://mosure.github.io' \
              "$url"
            tr -d '\r' < "$headers" > "$headers.normalized"
            mv "$headers.normalized" "$headers"
            grep -Eqi '^access-control-allow-origin: (https://mosure\.github\.io|\*)$' \
              "$headers"
          }

          fetch_manifest \
            "$MODEL_BASE_URL/manifest.json" \
            "$manifest_file" \
            "$scratch/parent.headers"
          jq -e \
            --arg bundle 'boogu-image-0.1-turbo' \
            --arg digest "$MODEL_CONTENT_DIGEST" \
            --arg qwen_bundle 'qwen3-vl-8b-base-boogu-image-0.1' \
            --arg vae_bundle 'flux1-vae-boogu-image-0.1' \
            '.schema_version == 2 and
             .bundle == $bundle and
             .profile == "f16-qwen-vision-f32" and
             .model == "Boogu/Boogu-Image-0.1-Turbo" and
             .model_revision == "53ad54522023f64d049f7f38e4d679359ef3fb92" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | type == "array" and length == 2) and
             ([.dependencies[].role] | sort) == ["qwen", "vae"] and
             any(.dependencies[]; .role == "qwen" and .bundle == $qwen_bundle) and
             any(.dependencies[]; .role == "vae" and .bundle == $vae_bundle) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$manifest_file" >/dev/null

          verify_range_contract() {
            local url="$1"
            local cache_policy="$2"
            local status
            local range_headers="$scratch/range.headers"
            status="$(
              curl --silent --show-error \
                --output /dev/null \
                --dump-header "$range_headers" \
                --write-out '%{http_code}' \
                --header 'Origin: https://mosure.github.io' \
                --header 'Range: bytes=0-0' \
                "$url"
            )"
            test "$status" = 206
            tr -d '\r' < "$range_headers" > "$range_headers.normalized"
            mv "$range_headers.normalized" "$range_headers"
            grep -Eqi '^access-control-allow-origin: (https://mosure\.github\.io|\*)$' \
              "$range_headers"
            grep -Eqi '^access-control-expose-headers:.*(content-range|\*)' "$range_headers"
            grep -Eqi '^content-range: bytes 0-0/[1-9][0-9]*$' "$range_headers"
            if [[ "$cache_policy" == immutable ]]; then
              grep -Eqi '^cache-control:.*immutable' "$range_headers"
            else
              grep -Eqi '^cache-control:.*no-cache' "$range_headers"
            fi
          }

          verify_range_contract "$MODEL_BASE_URL/manifest.json" no-cache
          parent_weight_path="$(
            jq -er 'first(.files[] | select(.role == "weights") | .path)' "$manifest_file"
          )"
          verify_range_contract "$MODEL_BASE_URL/$parent_weight_path" immutable

          for role in qwen vae; do
            dependency_file="$scratch/$role-dependency.json"
            jq -e --arg role "$role" \
              '.dependencies[] | select(.role == $role)' \
              "$manifest_file" > "$dependency_file"
            dependency_bundle="$(jq -er '.bundle' "$dependency_file")"
            dependency_base_url="$model_root_url/$dependency_bundle"
            child_manifest="$scratch/$role.json"

            fetch_manifest \
              "$dependency_base_url/manifest.json" \
              "$child_manifest" \
              "$scratch/$role.headers"
            jq -e \
              --slurpfile dependency "$dependency_file" \
              --arg role "$role" \
              '.schema_version == 1 and
               .bundle == $dependency[0].bundle and
               .profile == $dependency[0].profile and
               .model == $dependency[0].model and
               .model_revision == $dependency[0].model_revision and
               .content_digest == $dependency[0].content_digest and
               .metadata.artifact_layout == "semantic-burnpack-v1" and
               .metadata.component_bundle == "true" and
               ((.dependencies // []) | length == 0) and
               any(.files[]; .role == "weights") and
               (if $role == "qwen" then
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("qwen-")))
                else
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("flux-vae-")))
                end)' \
              "$child_manifest" >/dev/null

            verify_range_contract "$dependency_base_url/manifest.json" no-cache
            child_weight_path="$(
              jq -er 'first(.files[] | select(.role == "weights") | .path)' "$child_manifest"
            )"
            verify_range_contract "$dependency_base_url/$child_weight_path" immutable
          done

          edit_manifest="$scratch/edit-parent.json"
          fetch_manifest \
            "$EDIT_MODEL_BASE_URL/manifest.json" \
            "$edit_manifest" \
            "$scratch/edit-parent.headers"
          jq -e \
            --slurpfile turbo "$manifest_file" \
            --arg digest "$EDIT_MODEL_CONTENT_DIGEST" \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-edit-turbo" and
             .profile == "f16-qwen-vision-f32" and
             .model == "Boogu/Boogu-Image-0.1-Edit-Turbo" and
             .model_revision == "132a0ab9051b42c1d9be4919a68873d1f132c0c8" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | sort_by(.role)) == ($turbo[0].dependencies | sort_by(.role)) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$edit_manifest" >/dev/null
          verify_range_contract "$EDIT_MODEL_BASE_URL/manifest.json" no-cache
          edit_weight_path="$(
            jq -er 'first(.files[] | select(.role == "weights") | .path)' "$edit_manifest"
          )"
          verify_range_contract "$EDIT_MODEL_BASE_URL/$edit_weight_path" immutable

      - name: setup frontend MSRV
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: install Cargo.lock-matched wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: build browser frontend
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p bevy_burn_image \
            --target wasm32-unknown-unknown \
            --profile wasm-release \
            --no-default-features \
            --features boogu-web \
            --locked \
            --lib

          wasm_input="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/wasm32-unknown-unknown/wasm-release/bevy_burn_image.wasm"
          mkdir -p crates/bevy_image/www/out
          wasm-bindgen \
            --target web \
            --out-dir crates/bevy_image/www/out \
            --out-name bevy_burn_image \
            "$wasm_input"

      - name: inspect pages artifact
        shell: bash
        run: |
          set -euo pipefail
          touch crates/bevy_image/www/.nojekyll

          test -s crates/bevy_image/www/index.html
          test -s crates/bevy_image/www/out/bevy_burn_image.js
          test -s crates/bevy_image/www/out/bevy_burn_image_bg.wasm
          grep -Eq '^export function start_boogu_web\(\)' \
            crates/bevy_image/www/out/bevy_burn_image.js
          grep -Eq '^export function provide_reference_image\(bytes\)' \
            crates/bevy_image/www/out/bevy_burn_image.js
          grep -Fq 'wasm.__wbindgen_start()' crates/bevy_image/www/out/bevy_burn_image.js
          grep -Fq 'burn-image-runtime' crates/bevy_image/www/index.html
          grep -Fq 'burn-image-progress' crates/bevy_image/www/index.html
          grep -Fq 'id="artifact-progress"' crates/bevy_image/www/index.html

          sed -n '/<script type="module">/,/<\/script>/p' crates/bevy_image/www/index.html \
            | sed '1d;$d' > "$RUNNER_TEMP/burn-image-index-module.mjs"
          node --check "$RUNNER_TEMP/burn-image-index-module.mjs"

          if find crates/bevy_image/www -type f \
            \( -name '*.bpk' -o -name '*.bpk.parts.json' -o -name '*.bpk.part-*' \
               -o -name '*.safetensors' -o -name '*.bin' -o -name '*.onnx' \
               -o -name '*.npy' -o -name '*.npz' -o -name '*.pt' -o -name '*.pth' \) \
            -print -quit | grep -q .; then
            echo "model artifacts must remain on the Aberration CDN" >&2
            exit 1
          fi

      - name: configure github pages
        uses: actions/configure-pages@v6

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/bevy_image/www

      - name: deploy github pages
        id: deployment
        uses: actions/deploy-pages@v5
