name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: report deployment readiness
        shell: bash
        env:
          AUTOMATIC_DEPLOYMENT_ENABLED: ${{ vars.BURN_IMAGE_PAGES_READY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "Manual deployment requested; the deploy job will verify every external prerequisite."
          elif [[ "$AUTOMATIC_DEPLOYMENT_ENABLED" == true ]]; then
            echo "Automatic Pages deployment is enabled."
          else
            echo "Pages deployment is gated until BURN_IMAGE_PAGES_READY=true."
            echo "Publish all ten canonical CDN entries and enable Pages with GitHub Actions first."
          fi

  deploy:
    needs: readiness
    if: github.event_name == 'workflow_dispatch' || vars.BURN_IMAGE_PAGES_READY == 'true'
    runs-on: ubuntu-latest
    # The ten-entry mixed-F16 plus shared-component Q4S release contains roughly 103 GB of
    # unique remote payload URLs.
    # Publication authentication streams and hashes each one sequentially before deployment.
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: setup frontend MSRV
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: build sealed-manifest verifier
        run: >-
          cargo build -p burn_boogu --release --locked --features import
          --bin boogu-verify-artifacts

      - name: verify canonical browser CDN contract
        shell: bash
        env:
          MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-turbo
          MODEL_CONTENT_DIGEST: 32b2f0a972d7c00e4bc914f949dcf15195c10c428be456330a168a556576138a
          Q4_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-turbo-q4s-block-up-to128-f32
          Q4_MODEL_CONTENT_DIGEST: 012237fb5e14c52188632ea220c043e5a9d59eaa243970100e7db35048942081
          EDIT_Q4_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-edit-turbo-q4s-block-up-to128-f32
          EDIT_Q4_MODEL_CONTENT_DIGEST: 663d6a50c0ecd0181c195b6dcfc628998163c84fb0bf7f95e71d553268e88689
          EDIT_1K5_Q4_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-edit-turbo-1k5-q4s-block-up-to128-f32
          EDIT_1K5_Q4_MODEL_CONTENT_DIGEST: 9c217773abc54358bf45ce62c77b6b83361cd8bb49bd8357218fa40e80056aaa
          EDIT_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-edit-turbo
          EDIT_MODEL_CONTENT_DIGEST: 6f2f56a1c13418aea6985dfd1922f2e724577a1067123535fba90f88886f5335
          EDIT_1K5_MODEL_BASE_URL: https://aberration.technology/model/boogu-image-0.1-edit-turbo-1k5
          EDIT_1K5_MODEL_CONTENT_DIGEST: 7d81dacfedc71c50639d303c52f035813a6f4cc0125166bd7c8879c8314dd620
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          manifest_file="$scratch/parent.json"
          model_root_url="${MODEL_BASE_URL%/*}"
          manifest_verifier="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/release/boogu-verify-artifacts"
          payload_inventory="$scratch/remote-payloads.tsv"
          readonly transport_part_target_bytes=$((20 * 1024 * 1024))
          readonly max_transport_shard_bytes=25000000
          readonly transport_layout_path='metadata/transport-layout.json'
          test -x "$manifest_verifier"
          : > "$payload_inventory"

          fetch_manifest() {
            local url="$1"
            local output="$2"
            local headers="$3"

            curl --fail --silent --show-error \
              --output "$output" \
              --dump-header "$headers" \
              --header 'Origin: https://mosure.github.io' \
              --header 'Accept-Encoding: identity' \
              "$url"
            tr -d '\r' < "$headers" > "$headers.normalized"
            mv "$headers.normalized" "$headers"
            grep -Eqi '^access-control-allow-origin: (https://mosure\.github\.io|\*)$' \
              "$headers"

            "$manifest_verifier" --manifest-only "$output" > "$output.seal-verification.json"
            jq -e '
              .sealed_manifest_verified == true and
              .payloads_verified == false and
              .verification_scope == "manifest-structure-and-sealed-content-digest-only"
            ' "$output.seal-verification.json" >/dev/null
          }

          fetch_manifest \
            "$MODEL_BASE_URL/manifest.json" \
            "$manifest_file" \
            "$scratch/parent.headers"
          jq -e \
            --arg bundle 'boogu-image-0.1-turbo' \
            --arg digest "$MODEL_CONTENT_DIGEST" \
            --arg qwen_bundle 'qwen3-vl-8b-base-boogu-image-0.1' \
            --arg vae_bundle 'flux1-vae-boogu-image-0.1' \
            '.schema_version == 2 and
             .bundle == $bundle and
             .profile == "f16-qwen-vision-f32" and
             .model == "Boogu/Boogu-Image-0.1-Turbo" and
             .model_revision == "53ad54522023f64d049f7f38e4d679359ef3fb92" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | type == "array" and length == 2) and
             ([.dependencies[].role] | sort) == ["qwen", "vae"] and
             any(.dependencies[]; .role == "qwen" and .bundle == $qwen_bundle) and
             any(.dependencies[]; .role == "vae" and .bundle == $vae_bundle) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$manifest_file" >/dev/null

          require_single_exact_header() {
            local headers="$1"
            local required_header="${2,,}"
            local expected_value="$3"

            awk -v required="$required_header" -v expected="$expected_value" '
              {
                separator = index($0, ":")
                if (separator == 0) {
                  next
                }
                name = tolower(substr($0, 1, separator - 1))
                if (name != required) {
                  next
                }
                count += 1
                value = substr($0, separator + 1)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                matched = value == expected
              }
              END { exit(count == 1 && matched ? 0 : 1) }
            ' "$headers"
          }

          require_identity_content_encoding() {
            local headers="$1"

            awk '
              {
                separator = index($0, ":")
                if (separator == 0) {
                  next
                }
                name = tolower(substr($0, 1, separator - 1))
                if (name != "content-encoding") {
                  next
                }
                count += 1
                value = tolower(substr($0, separator + 1))
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              }
              END { exit(count == 0 || (count == 1 && value == "identity") ? 0 : 1) }
            ' "$headers"
          }

          verify_complete_object_contract() {
            local url="$1"
            local cache_policy="$2"
            local expected_size="$3"
            local downloaded_bytes
            local response_metrics
            local status
            local complete_headers="$scratch/complete.headers"
            [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
            response_metrics="$(
              curl --silent --show-error \
                --output /dev/null \
                --dump-header "$complete_headers" \
                --write-out $'%{http_code}\t%{size_download}' \
                --header 'Origin: https://mosure.github.io' \
                --header 'Accept-Encoding: identity' \
                "$url"
            )"
            IFS=$'\t' read -r status downloaded_bytes <<< "$response_metrics"
            test "$status" = 200
            test "$downloaded_bytes" = "$expected_size"
            tr -d '\r' < "$complete_headers" > "$complete_headers.normalized"
            mv "$complete_headers.normalized" "$complete_headers"
            grep -Eqi '^access-control-allow-origin: (https://mosure\.github\.io|\*)$' \
              "$complete_headers"
            require_single_exact_header \
              "$complete_headers" content-length "$expected_size"
            require_identity_content_encoding "$complete_headers"
            ! grep -Eqi '^content-range:' "$complete_headers"
            if [[ "$cache_policy" == immutable ]]; then
              grep -Eqi '^cache-control:.*immutable' "$complete_headers"
            elif [[ "$cache_policy" == manifest ]]; then
              if ! grep -Eqi '^cache-control:.*no-cache' "$complete_headers"; then
                echo "::warning title=Manifest cache policy::$url is not served with Cache-Control: no-cache; continuing because its sealed digest and every physical payload remain mandatory."
              fi
            else
              echo "unknown cache policy $cache_policy for $url" >&2
              return 1
            fi
          }

          verify_manifest_contract() {
            local manifest="$1"
            local base_url="$2"
            local bundle_name
            local layout_file
            local layout_manifest_size
            local layout_manifest_sha256
            local layout_actual_size
            local layout_actual_sha256
            local layout_report
            local manifest_size
            local declared_files=0
            local declared_transport_parts=0
            local path
            local role
            local expected_size
            local expected_sha256

            jq -e '
              (.files | type == "array" and length > 0) and
              all(.files[];
                ((.path | type) == "string") and
                (.path | length > 0) and
                ((.size | type) == "number") and
                (.size > 0) and
                (.size == (.size | floor)) and
                ((.sha256 | type) == "string") and
                (.sha256 | test("^[0-9a-f]{64}$"))) and
              (([.files[].path] | unique | length) == (.files | length)) and
              .metadata.transport_layout_path == "metadata/transport-layout.json" and
              .metadata.transport_layout_schema == "1" and
              .metadata.transport_parts_required == "true" and
              .metadata.transport_part_target_bytes == "20971520" and
              .metadata.target_max_transport_shard_bytes == "25000000" and
              .metadata.semantic_object_max_bytes == "268435456" and
              .metadata.target_max_shard_bytes == "268435456" and
              ([.files[] | select(.path == "metadata/transport-layout.json" and .role == "metadata")] | length) == 1
            ' "$manifest" >/dev/null
            manifest_size="$(stat --format='%s' "$manifest")"
            verify_complete_object_contract "$base_url/manifest.json" manifest "$manifest_size"

            bundle_name="${base_url##*/}"
            layout_file="$scratch/$bundle_name.transport-layout.json"
            IFS=$'\t' read -r layout_manifest_size layout_manifest_sha256 < <(
              jq -er --arg path "$transport_layout_path" '
                .files[] | select(.path == $path and .role == "metadata") |
                [(.size | tostring), .sha256] | @tsv
              ' "$manifest"
            )
            [[ "$layout_manifest_size" =~ ^[1-9][0-9]*$ ]]
            ((layout_manifest_size <= max_transport_shard_bytes))
            [[ "$layout_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
            curl --fail --silent --show-error \
              --output "$layout_file" \
              --header 'Origin: https://mosure.github.io' \
              --header 'Accept-Encoding: identity' \
              "$base_url/$transport_layout_path"
            layout_actual_size="$(stat --format='%s' "$layout_file")"
            layout_actual_sha256="$(sha256sum "$layout_file" | awk '{print $1}')"
            test "$layout_actual_size" = "$layout_manifest_size"
            test "$layout_actual_sha256" = "$layout_manifest_sha256"
            layout_report="$layout_file.verification.json"
            "$manifest_verifier" \
              --manifest-only "$manifest" \
              --transport-layout "$layout_file" > "$layout_report"
            jq -e \
              --argjson target "$transport_part_target_bytes" \
              --argjson maximum "$max_transport_shard_bytes" '
                .sealed_manifest_verified == true and
                .transport_layout_verified == true and
                .transport_payloads_verified == false and
                .transport_part_target_bytes == $target and
                .maximum_transport_part_bytes == $maximum and
                .transport_part_count > 0 and
                .largest_transport_part_bytes <= $maximum
              ' "$layout_report" >/dev/null

            while IFS=$'\t' read -r path role expected_size expected_sha256; do
              [[ "$path" =~ ^[A-Za-z0-9._/-]+$ ]]
              [[ "$path" != /* ]]
              [[ "$path" != *//* ]]
              [[ "/$path/" != */../* ]]
              [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
              [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
              if [[ "$role" == weights ]]; then
                declared_files=$((declared_files + 1))
                continue
              fi
              ((expected_size <= max_transport_shard_bytes))
              verify_complete_object_contract "$base_url/$path" immutable "$expected_size"
              printf '%s\t%s\t%s\n' \
                "$base_url/$path" "$expected_size" "$expected_sha256" >> "$payload_inventory"
              declared_files=$((declared_files + 1))
            done < <(
              jq -er '.files[] | [.path, .role, (.size | tostring), .sha256] | @tsv' "$manifest"
            )
            test "$declared_files" -gt 0

            while IFS=$'\t' read -r path expected_size expected_sha256; do
              [[ "$path" =~ ^transport/[0-9a-f]{64}\.part$ ]]
              [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
              ((expected_size <= transport_part_target_bytes))
              ((expected_size <= max_transport_shard_bytes))
              [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
              test "${path#transport/}" = "$expected_sha256.part"
              verify_complete_object_contract "$base_url/$path" immutable "$expected_size"
              printf '%s\t%s\t%s\n' \
                "$base_url/$path" "$expected_size" "$expected_sha256" >> "$payload_inventory"
              declared_transport_parts=$((declared_transport_parts + 1))
            done < <(
              jq -er '.objects[].parts[] | [.path, (.size | tostring), .sha256] | @tsv' "$layout_file"
            )
            test "$declared_transport_parts" -gt 0
          }

          authenticate_remote_payloads() {
            local unique_inventory="$scratch/remote-payloads.unique.tsv"
            local payload_file="$scratch/remote-payload.bin"
            local url
            local expected_size
            local expected_sha256
            local actual_size
            local actual_sha256
            local attempt
            local authenticated
            local authenticated_files=0
            local authenticated_bytes=0

            LC_ALL=C sort -u "$payload_inventory" > "$unique_inventory"
            awk -F '\t' '
              {
                contract = $2 FS $3
                if (($1 in contracts) && contracts[$1] != contract) {
                  print "remote payload URL has conflicting size/SHA-256 contracts: " $1 > "/dev/stderr"
                  exit 1
                }
                contracts[$1] = contract
              }
            ' "$unique_inventory"

            while IFS=$'\t' read -r url expected_size expected_sha256; do
              [[ "$url" == https://* ]]
              [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
              ((expected_size <= max_transport_shard_bytes))
              [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
              authenticated=0
              for attempt in 1 2 3; do
                actual_sha256=""
                if actual_sha256="$(
                  curl --fail --silent --show-error \
                    --connect-timeout 30 \
                    --speed-limit 1024 \
                    --speed-time 120 \
                    --header 'Origin: https://mosure.github.io' \
                    --header 'Accept-Encoding: identity' \
                    "$url" | tee "$payload_file" | sha256sum | awk '{print $1}'
                )"; then
                  actual_size="$(stat --format='%s' "$payload_file")"
                  if [[ "$actual_size" == "$expected_size" && \
                        "$actual_sha256" == "$expected_sha256" ]]; then
                    authenticated=1
                    break
                  fi
                  echo "remote payload integrity mismatch on attempt $attempt: $url" >&2
                  echo "expected bytes/SHA-256: $expected_size $expected_sha256" >&2
                  echo "actual bytes/SHA-256:   $actual_size $actual_sha256" >&2
                else
                  echo "remote payload download failed on attempt $attempt: $url" >&2
                fi
                if ((attempt < 3)); then
                  sleep $((attempt * 2))
                fi
              done
              if ((authenticated == 0)); then
                echo "remote payload failed exact full-object authentication: $url" >&2
                return 1
              fi
              authenticated_files=$((authenticated_files + 1))
              authenticated_bytes=$((authenticated_bytes + expected_size))
            done < "$unique_inventory"

            echo "authenticated $authenticated_files unique remote payload URLs ($authenticated_bytes bytes)"
          }

          verify_manifest_contract "$manifest_file" "$MODEL_BASE_URL"

          for role in qwen vae; do
            dependency_file="$scratch/$role-dependency.json"
            jq -e --arg role "$role" \
              '.dependencies[] | select(.role == $role)' \
              "$manifest_file" > "$dependency_file"
            dependency_bundle="$(jq -er '.bundle' "$dependency_file")"
            dependency_base_url="$model_root_url/$dependency_bundle"
            child_manifest="$scratch/$role.json"

            fetch_manifest \
              "$dependency_base_url/manifest.json" \
              "$child_manifest" \
              "$scratch/$role.headers"
            jq -e \
              --slurpfile dependency "$dependency_file" \
              --arg role "$role" \
              '.schema_version == 1 and
               .bundle == $dependency[0].bundle and
               .profile == $dependency[0].profile and
               .model == $dependency[0].model and
               .model_revision == $dependency[0].model_revision and
               .content_digest == $dependency[0].content_digest and
               .metadata.artifact_layout == "semantic-burnpack-v1" and
               .metadata.component_bundle == "true" and
               ((.dependencies // []) | length == 0) and
               any(.files[]; .role == "weights") and
               (if $role == "qwen" then
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("qwen-")))
                else
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("flux-vae-")))
                end)' \
              "$child_manifest" >/dev/null

            verify_manifest_contract "$child_manifest" "$dependency_base_url"
          done

          edit_manifest="$scratch/edit-parent.json"
          fetch_manifest \
            "$EDIT_MODEL_BASE_URL/manifest.json" \
            "$edit_manifest" \
            "$scratch/edit-parent.headers"
          jq -e \
            --slurpfile turbo "$manifest_file" \
            --arg digest "$EDIT_MODEL_CONTENT_DIGEST" \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-edit-turbo" and
             .profile == "f16-qwen-vision-f32" and
             .model == "Boogu/Boogu-Image-0.1-Edit-Turbo" and
             .model_revision == "132a0ab9051b42c1d9be4919a68873d1f132c0c8" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | sort_by(.role)) == ($turbo[0].dependencies | sort_by(.role)) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$edit_manifest" >/dev/null
          verify_manifest_contract "$edit_manifest" "$EDIT_MODEL_BASE_URL"

          edit_1k5_manifest="$scratch/edit-1k5-parent.json"
          fetch_manifest \
            "$EDIT_1K5_MODEL_BASE_URL/manifest.json" \
            "$edit_1k5_manifest" \
            "$scratch/edit-1k5-parent.headers"
          jq -e \
            --slurpfile turbo "$manifest_file" \
            --arg digest "$EDIT_1K5_MODEL_CONTENT_DIGEST" \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-edit-turbo-1k5" and
             .profile == "f16-qwen-vision-f32" and
             .model == "Boogu/Boogu-Image-0.1-Edit-Turbo-1K5" and
             .model_revision == "60981c49e48cffadf2c169532a4ba3f6108afd5e" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | sort_by(.role)) == ($turbo[0].dependencies | sort_by(.role)) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$edit_1k5_manifest" >/dev/null
          verify_manifest_contract "$edit_1k5_manifest" "$EDIT_1K5_MODEL_BASE_URL"

          q4_manifest="$scratch/turbo-q4s.json"
          fetch_manifest \
            "$Q4_MODEL_BASE_URL/manifest.json" \
            "$q4_manifest" \
            "$scratch/turbo-q4s.headers"
          jq -e \
            --arg digest "$Q4_MODEL_CONTENT_DIGEST" \
            --arg qwen_bundle 'qwen3-vl-8b-base-boogu-image-0.1-q4s-block-up-to128-f32' \
            --arg vae_bundle 'flux1-vae-boogu-image-0.1-f16-shared' \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-turbo-q4s-block-up-to128-f32" and
             .profile == "q4s-block-up-to128-f32" and
             .numeric_format.other == "q4s-block-up-to128-f32" and
             .model == "Boogu/Boogu-Image-0.1-Turbo" and
             .model_revision == "53ad54522023f64d049f7f38e4d679359ef3fb92" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | type == "array" and length == 2) and
             ([.dependencies[].role] | sort) == ["qwen", "vae"] and
             any(.dependencies[]; .role == "qwen" and .bundle == $qwen_bundle) and
             any(.dependencies[]; .role == "vae" and .bundle == $vae_bundle) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$q4_manifest" >/dev/null
          verify_manifest_contract "$q4_manifest" "$Q4_MODEL_BASE_URL"

          for role in qwen vae; do
            dependency_file="$scratch/q4-$role-dependency.json"
            jq -e --arg role "$role" \
              '.dependencies[] | select(.role == $role)' \
              "$q4_manifest" > "$dependency_file"
            dependency_bundle="$(jq -er '.bundle' "$dependency_file")"
            dependency_base_url="$model_root_url/$dependency_bundle"
            child_manifest="$scratch/q4-$role.json"

            fetch_manifest \
              "$dependency_base_url/manifest.json" \
              "$child_manifest" \
              "$scratch/q4-$role.headers"
            jq -e \
              --slurpfile dependency "$dependency_file" \
              --arg role "$role" \
              '.schema_version == 1 and
               .bundle == $dependency[0].bundle and
               .profile == $dependency[0].profile and
               .model == $dependency[0].model and
               .model_revision == $dependency[0].model_revision and
               .content_digest == $dependency[0].content_digest and
               .metadata.artifact_layout == "semantic-burnpack-v1" and
               .metadata.component_bundle == "true" and
               ((.dependencies // []) | length == 0) and
               any(.files[]; .role == "weights") and
               (if $role == "qwen" then
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("qwen-")))
                else
                  all(.files[]; .role != "weights" or ((.component // "") | startswith("flux-vae-")))
                end)' \
              "$child_manifest" >/dev/null

            verify_manifest_contract "$child_manifest" "$dependency_base_url"
          done

          edit_q4_manifest="$scratch/edit-turbo-q4s.json"
          fetch_manifest \
            "$EDIT_Q4_MODEL_BASE_URL/manifest.json" \
            "$edit_q4_manifest" \
            "$scratch/edit-turbo-q4s.headers"
          jq -e \
            --slurpfile turbo "$q4_manifest" \
            --arg digest "$EDIT_Q4_MODEL_CONTENT_DIGEST" \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-edit-turbo-q4s-block-up-to128-f32" and
             .profile == "q4s-block-up-to128-f32" and
             .numeric_format.other == "q4s-block-up-to128-f32" and
             .model == "Boogu/Boogu-Image-0.1-Edit-Turbo" and
             .model_revision == "132a0ab9051b42c1d9be4919a68873d1f132c0c8" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | sort_by(.role)) == ($turbo[0].dependencies | sort_by(.role)) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$edit_q4_manifest" >/dev/null
          verify_manifest_contract "$edit_q4_manifest" "$EDIT_Q4_MODEL_BASE_URL"

          edit_1k5_q4_manifest="$scratch/edit-turbo-1k5-q4s.json"
          fetch_manifest \
            "$EDIT_1K5_Q4_MODEL_BASE_URL/manifest.json" \
            "$edit_1k5_q4_manifest" \
            "$scratch/edit-turbo-1k5-q4s.headers"
          jq -e \
            --slurpfile turbo "$q4_manifest" \
            --arg digest "$EDIT_1K5_Q4_MODEL_CONTENT_DIGEST" \
            '.schema_version == 2 and
             .bundle == "boogu-image-0.1-edit-turbo-1k5-q4s-block-up-to128-f32" and
             .profile == "q4s-block-up-to128-f32" and
             .numeric_format.other == "q4s-block-up-to128-f32" and
             .model == "Boogu/Boogu-Image-0.1-Edit-Turbo-1K5" and
             .model_revision == "60981c49e48cffadf2c169532a4ba3f6108afd5e" and
             .content_digest == $digest and
             .metadata.artifact_layout == "semantic-burnpack-composition-v2" and
             .metadata.composition_manifest == "true" and
             .metadata.component_dependency_count == "2" and
             (.dependencies | sort_by(.role)) == ($turbo[0].dependencies | sort_by(.role)) and
             any(.files[]; .role == "weights") and
             all(.files[]; .role != "weights" or ((.component // "") | startswith("boogu-")))' \
            "$edit_1k5_q4_manifest" >/dev/null
          verify_manifest_contract "$edit_1k5_q4_manifest" "$EDIT_1K5_Q4_MODEL_BASE_URL"

          authenticate_remote_payloads

      - name: install Cargo.lock-matched wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: build browser frontend
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p bevy_burn_image \
            --target wasm32-unknown-unknown \
            --profile wasm-release \
            --no-default-features \
            --features boogu-web \
            --locked \
            --lib

          wasm_input="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/wasm32-unknown-unknown/wasm-release/bevy_burn_image.wasm"
          mkdir -p crates/bevy_image/www/out
          wasm-bindgen \
            --target web \
            --out-dir crates/bevy_image/www/out \
            --out-name bevy_burn_image \
            "$wasm_input"
          install -m 0644 crates/bevy_image/www/burn-image-icon.png \
            crates/bevy_image/www/out/burn-image-icon.png

      - name: inspect pages artifact
        shell: bash
        run: |
          set -euo pipefail
          touch crates/bevy_image/www/.nojekyll

          test -s crates/bevy_image/www/index.html
          test -s crates/bevy_image/www/model_selector.mjs
          test -s crates/bevy_image/www/burn-image-icon.png
          test -s crates/bevy_image/www/out/burn-image-icon.png
          test -s crates/bevy_image/www/out/bevy_burn_image.js
          test -s crates/bevy_image/www/out/bevy_burn_image_bg.wasm
          grep -Eq '^export function start_boogu_web\(\)' \
            crates/bevy_image/www/out/bevy_burn_image.js
          grep -Eq '^export function provide_reference_image\(bytes\)' \
            crates/bevy_image/www/out/bevy_burn_image.js
          grep -Eq '^export function provide_reference_image_error\(message\)' \
            crates/bevy_image/www/out/bevy_burn_image.js
          grep -Fq 'wasm.__wbindgen_start()' crates/bevy_image/www/out/bevy_burn_image.js
          grep -Fq 'id="burn-image"' crates/bevy_image/www/index.html
          grep -Fq 'provide_reference_image_error' crates/bevy_image/www/index.html
          ! grep -Fq 'id="model-loader"' crates/bevy_image/www/index.html
          ! grep -Fq 'id="artifact-progress"' crates/bevy_image/www/index.html
          grep -Fq './out/burn-image-icon.png' crates/bevy_image/www/index.html
          cmp -s crates/bevy_image/www/burn-image-icon.png \
            crates/bevy_image/www/out/burn-image-icon.png
          file crates/bevy_image/www/out/burn-image-icon.png \
            | grep -Fq 'PNG image data, 512 x 512, 8-bit/color RGB'
          node --check crates/bevy_image/www/model_selector.mjs

          sed -n '/<script type="module">/,/<\/script>/p' crates/bevy_image/www/index.html \
            | sed '1d;$d' > "$RUNNER_TEMP/burn-image-index-module.mjs"
          node --check "$RUNNER_TEMP/burn-image-index-module.mjs"

          if find crates/bevy_image/www -type f \
            \( -name '*.bpk' -o -name '*.bpk.parts.json' -o -name '*.bpk.part-*' \
               -o -name '*.safetensors' -o -name '*.bin' -o -name '*.onnx' \
               -o -name '*.npy' -o -name '*.npz' -o -name '*.pt' -o -name '*.pth' \) \
            -print -quit | grep -q .; then
            echo "model artifacts must remain on the Aberration CDN" >&2
            exit 1
          fi

      - name: configure github pages
        uses: actions/configure-pages@v6

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/bevy_image/www

      - name: deploy github pages
        id: deployment
        uses: actions/deploy-pages@v5
