name: Real checkpoint release parity

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Artifact profile
        required: true
        default: f16-qwen-vision-f32
        type: choice
        options:
          - f16-qwen-vision-f32
      turbo_snapshot:
        description: Absolute path to the pinned Turbo Hugging Face snapshot on the runner
        required: true
        type: string
      edit_snapshot:
        description: Absolute path to the pinned Edit-Turbo Hugging Face snapshot on the runner
        required: true
        type: string
      turbo_artifacts:
        description: Absolute path to the exact dependency-free Turbo conversion source required by parity binaries
        required: true
        type: string
      edit_artifacts:
        description: Absolute path to the exact dependency-free Edit-Turbo conversion source required by parity binaries
        required: true
        type: string
      edit_1k5_snapshot:
        description: Absolute path to the pinned Edit-Turbo 1.5K snapshot on the runner
        required: true
        type: string
      edit_1k5_artifacts:
        description: Absolute path to the exact dependency-free Edit-Turbo 1.5K conversion source required by parity binaries
        required: true
        type: string
      edit_1k5_fixture:
        description: Absolute path to the exhaustive Edit-Turbo 1.5K schema-2 fixture directory
        required: true
        type: string
      modular_artifact_root:
        description: Absolute canonical publication root containing three schema-v2 parents and shared Qwen/VAE component directories
        required: true
        type: string
      reference_fixtures:
        description: Absolute path containing external Turbo and 1K Edit fixture directories
        required: true
        type: string
      display:
        description: X11 display used by the headful rendered-browser qualification
        required: true
        default: ":0"
        type: string

permissions:
  contents: read

jobs:
  parity:
    runs-on: [self-hosted, gpu, burn-image]
    timeout-minutes: 720
    env:
      CARGO_TERM_COLOR: always
      PROFILE: ${{ inputs.profile }}
      BURN_IMAGE_TURBO_SNAPSHOT: ${{ inputs.turbo_snapshot }}
      BURN_IMAGE_EDIT_SNAPSHOT: ${{ inputs.edit_snapshot }}
      BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS: ${{ inputs.turbo_artifacts }}
      BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS: ${{ inputs.edit_artifacts }}
      BURN_IMAGE_EDIT_1K5_SNAPSHOT: ${{ inputs.edit_1k5_snapshot }}
      BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS: ${{ inputs.edit_1k5_artifacts }}
      BURN_IMAGE_EDIT_1K5_FIXTURE: ${{ inputs.edit_1k5_fixture }}
      BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT: ${{ inputs.modular_artifact_root }}
      BURN_IMAGE_REFERENCE_FIXTURES: ${{ inputs.reference_fixtures }}
      DISPLAY: ${{ inputs.display }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Authenticate pinned snapshots, bundles, and external oracles
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROFILE" != "f16-qwen-vision-f32" ]]; then
            echo "release parity requires f16-qwen-vision-f32, got: $PROFILE" >&2
            exit 2
          fi

          for variable in \
            BURN_IMAGE_TURBO_SNAPSHOT \
            BURN_IMAGE_EDIT_SNAPSHOT \
            BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS \
            BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS \
            BURN_IMAGE_EDIT_1K5_SNAPSHOT \
            BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS \
            BURN_IMAGE_EDIT_1K5_FIXTURE \
            BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT \
            BURN_IMAGE_REFERENCE_FIXTURES \
            DISPLAY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required input is empty: $variable" >&2
              exit 2
            fi
          done

          for directory in \
            "$BURN_IMAGE_TURBO_SNAPSHOT" \
            "$BURN_IMAGE_EDIT_SNAPSHOT" \
            "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            "$BURN_IMAGE_EDIT_1K5_SNAPSHOT" \
            "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT" \
            "$BURN_IMAGE_REFERENCE_FIXTURES"; do
            if [[ ! -d "$directory" ]]; then
              echo "required external directory is missing: $directory" >&2
              exit 2
            fi
          done

          for bundle in \
            boogu-image-0.1-turbo \
            boogu-image-0.1-edit-turbo \
            boogu-image-0.1-edit-turbo-1k5 \
            qwen3-vl-8b-base-boogu-image-0.1 \
            flux1-vae-boogu-image-0.1; do
            if [[ ! -f "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/$bundle/manifest.json" ]]; then
              echo "required canonical modular artifact manifest is missing: $bundle" >&2
              exit 2
            fi
          done

          if [[ "$(realpath -e "$BURN_IMAGE_EDIT_SNAPSHOT")" == \
                "$(realpath -e "$BURN_IMAGE_EDIT_1K5_SNAPSHOT")" ]]; then
            echo "Edit-Turbo 1K and 1.5K must use distinct pinned snapshots" >&2
            exit 2
          fi
          if [[ "$(realpath -e "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS")" == \
                "$(realpath -e "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS")" ]]; then
            echo "Edit-Turbo 1K and 1.5K must use distinct flat parity bundles" >&2
            exit 2
          fi
          canonical_1k5_parent="$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/boogu-image-0.1-edit-turbo-1k5"
          if [[ "$(realpath -e "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS")" == \
                "$(realpath -e "$canonical_1k5_parent")" ]]; then
            echo "Edit-Turbo 1.5K flat parity bundle must be distinct from the canonical modular parent" >&2
            exit 2
          fi

          verify_exact_file() {
            local expected="$1"
            local actual="$2"
            if [[ ! -f "$actual" ]]; then
              echo "required parity oracle is missing: $actual" >&2
              exit 2
            fi
            printf '%s  %s\n' "$expected" "$actual" | sha256sum --check --status - || {
              echo "real parity oracle hash mismatch: $actual" >&2
              exit 2
            }
          }

          turbo_fixture="$BURN_IMAGE_REFERENCE_FIXTURES/turbo"
          edit_fixture="$BURN_IMAGE_REFERENCE_FIXTURES/edit"

          verify_exact_file \
            b85f757d18c5dfdb94b3366692d0b3ceb6f73d699e98820ba5177d90d36d838d \
            "$turbo_fixture/metadata.json"
          verify_exact_file \
            d26178de365bea3a7e4fef6c9a292e8220af5481dfe398e74491817adc1fcd75 \
            "$turbo_fixture/tensors.safetensors"
          verify_exact_file \
            80beb2ebd1f15ead37b48bab2741beb0e06befe1530730eba304596b5a1d5554 \
            "$turbo_fixture/output.png"

          verify_exact_file \
            6891260a32639e65338558d4d2898ffd2f9aef10f479c62de953150ae37b9221 \
            "$edit_fixture/metadata.json"
          verify_exact_file \
            831ca9e288de13ed682f8e260170957161ad5b338b028717f89e9d540b6317ee \
            "$edit_fixture/tensors.safetensors"
          verify_exact_file \
            96534b93904478caf92c1d0e1b431396f81e7b62f09bb5505443378f245d9647 \
            "$edit_fixture/source.png"
          verify_exact_file \
            1bb10a67af8e56f40f3aefec07f99a37990c539f3b66126bc861d5231dcf6201 \
            "$edit_fixture/output.png"

          # Only this exhaustive 372-tensor oracle qualifies Edit-Turbo 1.5K.
          verify_exact_file \
            1e78233c703ed32ee351c25d54ca4b05e3efeb898ee2836d1cc96c522e2abcae \
            "$BURN_IMAGE_EDIT_1K5_FIXTURE/metadata.json"
          verify_exact_file \
            2585ddf2337e41f884218a4abeceb8a10baa7553e43d37f33016be68edc3eeb9 \
            "$BURN_IMAGE_EDIT_1K5_FIXTURE/tensors.safetensors"
          verify_exact_file \
            96534b93904478caf92c1d0e1b431396f81e7b62f09bb5505443378f245d9647 \
            "$BURN_IMAGE_EDIT_1K5_FIXTURE/source.png"
          verify_exact_file \
            8e88d6c3580593da723049ef4027a60c5d730b6006ef766d49971a23c6446a70 \
            "$BURN_IMAGE_EDIT_1K5_FIXTURE/output.png"

      - name: Verify canonical modular published artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/boogu-image-0.1-turbo" \
            --require-published-release
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/boogu-image-0.1-edit-turbo" \
            --require-published-release
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/boogu-image-0.1-edit-turbo-1k5" \
            --require-published-release \
            --require-edit-turbo-1k5-release

      - name: Verify exact conversion-source parity artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            --require-source-release
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            --require-source-release
          cargo run -p burn_boogu --release --locked --features import \
            --bin boogu-verify-artifacts -- \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --require-source-release \
            --require-edit-turbo-1k5-release

      - name: Processor reference parity
        shell: bash
        run: |
          set -euo pipefail
          BOOGU_PROCESSOR_MODEL_DIR="$BURN_IMAGE_TURBO_SNAPSHOT" \
          BOOGU_PROCESSOR_FIXTURE_DIR="$BURN_IMAGE_REFERENCE_FIXTURES/turbo" \
            cargo test -p burn_boogu --release --locked --features runtime,import \
              real_boogu_processor_reference -- --nocapture
          BOOGU_PROCESSOR_MODEL_DIR="$BURN_IMAGE_EDIT_SNAPSHOT" \
          BOOGU_PROCESSOR_FIXTURE_DIR="$BURN_IMAGE_REFERENCE_FIXTURES/edit" \
            cargo test -p burn_boogu --release --locked --features runtime,import \
              real_boogu_processor_reference -- --nocapture
          BOOGU_PROCESSOR_MODEL_DIR="$BURN_IMAGE_EDIT_1K5_SNAPSHOT" \
          BOOGU_PROCESSOR_FIXTURE_DIR="$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            cargo test -p burn_boogu --release --locked --features runtime,import \
              real_boogu_processor_reference -- --nocapture

      - name: Qwen WGPU reference parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features import,wgpu \
            --bin boogu-qwen-parity -- \
            --artifacts "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/turbo" \
            --profile "$PROFILE" \
            --query-chunk-size 128 \
            --capture-stages true \
            --minimum-cosine 0.997 \
            --maximum-relative-rmse 0.10 \
            --require
          cargo run -p burn_boogu --release --locked --features import,wgpu \
            --bin boogu-qwen-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/edit" \
            --profile "$PROFILE" \
            --query-chunk-size 128 \
            --capture-stages true \
            --minimum-cosine 0.994 \
            --maximum-relative-rmse 0.11 \
            --require
          cargo run -p burn_boogu --release --locked --features import,wgpu \
            --bin boogu-qwen-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            --profile "$PROFILE" \
            --query-chunk-size 128 \
            --capture-stages true \
            --minimum-cosine 0.994 \
            --maximum-relative-rmse 0.11 \
            --require

      - name: VAE and DMD WGPU reference parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-parity -- \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/turbo" \
            --artifacts "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            --profile "$PROFILE" --backend wgpu --require
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-parity -- \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/edit" \
            --artifacts "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            --profile "$PROFILE" --backend wgpu --require
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-parity -- \
            --fixture "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --profile "$PROFILE" --backend wgpu --require

      - name: Denoiser WGPU boundary parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-denoiser-parity -- \
            --artifacts "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/turbo" \
            --backend wgpu --profile "$PROFILE" --steps 4 \
            --input-mode isolated --capture-boundaries true --require
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-denoiser-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/edit" \
            --backend wgpu --profile "$PROFILE" --steps 4 \
            --input-mode isolated --capture-boundaries true --require
          cargo run -p burn_boogu --release --locked --features import,ndarray,wgpu \
            --bin boogu-denoiser-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            --backend wgpu --profile "$PROFILE" --steps 4 \
            --input-mode isolated --capture-boundaries true --require

      - name: Turbo production full-chain WGPU parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features runtime,import,wgpu,autotune \
            --bin boogu-full-parity -- \
            --artifacts "$BURN_IMAGE_TURBO_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/turbo" \
            --profile "$PROFILE" \
            --qwen-residency retained \
            --qwen-synchronization-policy deferred \
            --vae-float-policy preserve-f16 \
            --vae-group-norm-policy f16-storage-f32-accum \
            --vae-attention-query-chunk-size 4096 \
            --qwen-query-chunk-size 128 \
            --denoiser-query-chunk-size 8192 \
            --denoiser-attention-policy padded-blackbox \
            --denoiser-rms-norm-policy strict-f32 \
            --denoiser-qk-preparation-policy balanced-strict-qk-norm-rope \
            --blackbox-num-planes 4 \
            --blackbox-seq-kv-tiles 1 \
            --blackbox-seq-q-tiles 1 \
            --require

      - name: Edit-Turbo 1K production full-chain WGPU parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features runtime,import,wgpu,autotune \
            --bin boogu-full-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_REFERENCE_FIXTURES/edit" \
            --profile "$PROFILE" \
            --qwen-residency retained \
            --qwen-synchronization-policy deferred \
            --vae-float-policy preserve-f16 \
            --vae-group-norm-policy f16-storage-f32-accum \
            --vae-attention-query-chunk-size 4096 \
            --qwen-query-chunk-size 128 \
            --denoiser-query-chunk-size 8192 \
            --denoiser-attention-policy padded-blackbox \
            --denoiser-rms-norm-policy strict-f32 \
            --denoiser-qk-preparation-policy balanced-strict-qk-norm-rope \
            --blackbox-num-planes 4 \
            --blackbox-seq-kv-tiles 1 \
            --blackbox-seq-q-tiles 1 \
            --require

      - name: Edit-Turbo 1.5K production full-chain WGPU parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p burn_boogu --release --locked --features runtime,import,wgpu,autotune \
            --bin boogu-full-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            --profile "$PROFILE" \
            --qwen-residency retained \
            --qwen-synchronization-policy deferred \
            --vae-float-policy preserve-f16 \
            --vae-group-norm-policy f16-storage-f32-accum \
            --vae-attention-query-chunk-size 4096 \
            --qwen-query-chunk-size 128 \
            --denoiser-query-chunk-size 16384 \
            --denoiser-attention-policy padded-blackbox \
            --denoiser-rms-norm-policy strict-f32 \
            --denoiser-qk-preparation-policy composed \
            --blackbox-num-planes 4 \
            --blackbox-seq-kv-tiles 1 \
            --blackbox-seq-q-tiles 1 \
            --require

      - name: Edit-Turbo 1.5K native low-VRAM full-chain parity
        id: native_low_vram_1k5
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-native-low-vram-1k5"
          mkdir -p "$output_dir"
          cargo run -p burn_boogu --release --locked --features runtime,import,wgpu,autotune \
            --bin boogu-full-parity -- \
            --artifacts "$BURN_IMAGE_EDIT_1K5_FLAT_PARITY_ARTIFACTS" \
            --fixture "$BURN_IMAGE_EDIT_1K5_FIXTURE" \
            --profile "$PROFILE" \
            --native-runtime-policy low-vram \
            --qwen-residency streamed \
            --qwen-synchronization-policy per-stage \
            --vae-float-policy preserve-f16 \
            --vae-group-norm-policy f16-storage-f32-accum \
            --vae-attention-query-chunk-size 4096 \
            --qwen-query-chunk-size 128 \
            --denoiser-query-chunk-size 16384 \
            --denoiser-attention-policy padded-blackbox \
            --denoiser-rms-norm-policy strict-f32 \
            --denoiser-qk-preparation-policy composed \
            --blackbox-num-planes 4 \
            --blackbox-seq-kv-tiles 1 \
            --blackbox-seq-q-tiles 1 \
            --require \
            > >(tee "$output_dir/report.json") \
            2> >(tee "$output_dir/stderr.log" >&2)

      - name: Install Cargo.lock-matched wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build final Boogu WebAssembly package
        id: build_boogu_web
        shell: bash
        run: |
          set -euo pipefail
          www_out="$RUNNER_TEMP/burn-image-boogu-web"
          mkdir -p "$www_out"

          cargo build -p bevy_burn_image \
            --target wasm32-unknown-unknown \
            --profile wasm-release \
            --no-default-features \
            --features boogu-web \
            --locked \
            --lib

          wasm_input="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}/wasm32-unknown-unknown/wasm-release/bevy_burn_image.wasm"
          wasm-bindgen \
            --target web \
            --out-dir "$www_out" \
            --out-name bevy_burn_image \
            "$wasm_input"
          install -m 0644 crates/bevy_image/www/burn-image-icon.png \
            "$www_out/burn-image-icon.png"

          test -s "$www_out/bevy_burn_image.js"
          test -s "$www_out/bevy_burn_image_bg.wasm"
          test -s "$www_out/burn-image-icon.png"
          cmp -s crates/bevy_image/www/burn-image-icon.png \
            "$www_out/burn-image-icon.png"
          grep -Eq '^export function start_boogu_web\(\)' "$www_out/bevy_burn_image.js"
          grep -Eq '^export function provide_reference_image\(bytes\)' \
            "$www_out/bevy_burn_image.js"
          grep -Eq '^export function provide_reference_image_error\(message\)' \
            "$www_out/bevy_burn_image.js"
          grep -Fq 'wasm.__wbindgen_start()' "$www_out/bevy_burn_image.js"
          sha256sum \
            "$www_out/bevy_burn_image.js" \
            "$www_out/bevy_burn_image_bg.wasm" \
            "$www_out/burn-image-icon.png"

      - name: Browser Edit-Turbo 1.5K low-VRAM parity
        id: browser_low_vram
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-browser-low-vram"
          mkdir -p "$output_dir"
          BURN_IMAGE_BROWSER_1K5_PARITY=1 \
          BURN_IMAGE_BROWSER_1K5_RESIDENCY=low-vram \
          BURN_IMAGE_BROWSER_1K5_PARITY_ARTIFACT_DIR="$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT/boogu-image-0.1-edit-turbo-1k5" \
          BURN_IMAGE_BROWSER_1K5_PARITY_FIXTURE_DIR="$BURN_IMAGE_EDIT_1K5_FIXTURE" \
          BURN_IMAGE_BROWSER_1K5_PARITY_WWW_OUT_DIR="$RUNNER_TEMP/burn-image-boogu-web" \
          BURN_IMAGE_BROWSER_1K5_PARITY_OUTPUT_DIR="$output_dir" \
            node crates/bevy_image/tests/wasm_browser_1k5_parity.mjs \
              2>&1 | tee "$output_dir/workflow-console.log"

      - name: Rendered Turbo 1024 low-VRAM model smoke
        id: browser_rendered_turbo_1024
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-rendered-turbo-1024"
          mkdir -p "$output_dir"
          artifact_root="$(realpath -e "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT")"
          for bundle in \
            boogu-image-0.1-turbo \
            qwen3-vl-8b-base-boogu-image-0.1 \
            flux1-vae-boogu-image-0.1; do
            test -f "$artifact_root/$bundle/manifest.json"
          done
          BURN_IMAGE_RENDERED_TURBO_1024_SMOKE=1 \
          BURN_IMAGE_RENDERED_TURBO_QWEN_BLOCK0_EXECUTION_MODE=ordinary \
          BURN_IMAGE_RENDERED_TURBO_ARTIFACT_ROOT="$artifact_root" \
          BURN_IMAGE_RENDERED_SURFACE_WWW_OUT_DIR="$RUNNER_TEMP/burn-image-boogu-web" \
          BURN_IMAGE_RENDERED_SURFACE_OUTPUT_DIR="$output_dir" \
            node crates/bevy_image/tests/wasm_rendered_surface_smoke.mjs \
              2>&1 | tee "$output_dir/workflow-console.log"

      - name: Rendered Turbo 1024 same-engine two-request qualification
        id: browser_rendered_turbo_1024_multi_request
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-rendered-turbo-1024-multi-request"
          mkdir -p "$output_dir"
          artifact_root="$(realpath -e "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT")"
          for bundle in \
            boogu-image-0.1-turbo \
            qwen3-vl-8b-base-boogu-image-0.1 \
            flux1-vae-boogu-image-0.1; do
            test -f "$artifact_root/$bundle/manifest.json"
          done
          BURN_IMAGE_RENDERED_TURBO_1024_MULTI_REQUEST_QUALIFICATION=1 \
          BURN_IMAGE_RENDERED_TURBO_QWEN_BLOCK0_EXECUTION_MODE=ordinary \
          BURN_IMAGE_RENDERED_TURBO_ARTIFACT_ROOT="$artifact_root" \
          BURN_IMAGE_RENDERED_SURFACE_WWW_OUT_DIR="$RUNNER_TEMP/burn-image-boogu-web" \
          BURN_IMAGE_RENDERED_SURFACE_OUTPUT_DIR="$output_dir" \
            node crates/bevy_image/tests/wasm_rendered_surface_smoke.mjs \
              2>&1 | tee "$output_dir/workflow-console.log"

      - name: Native Turbo 1024 low-VRAM ordinary-frontend qualification
        id: native_turbo_1024_output
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-native-low-vram-turbo-1024"
          mkdir -p "$output_dir"
          artifact_root="$(realpath -e "$BURN_IMAGE_CANONICAL_MODULAR_ARTIFACT_ROOT")"
          qualification_prompt='A studio photograph of a blue ceramic bird on a plain white table.'
          grep -Fqx \
            "const MODEL_PROMPT = \"$qualification_prompt\";" \
            crates/bevy_image/tests/wasm_rendered_surface_smoke.mjs
          cargo run -p bevy_burn_image --release --locked \
            --features boogu-native,native-autotune \
            --bin burn-image-viewer -- \
            --artifacts "$artifact_root/boogu-image-0.1-turbo" \
            --variant turbo \
            --profile production \
            --residency low-vram \
            --qualification-output-dir "$output_dir" \
            --qualification-prompt "$qualification_prompt" \
            --qualification-seed 0 \
            --qualification-width 1024 \
            --qualification-height 1024 \
            2>&1 | tee "$output_dir/workflow-console.log"

      - name: Required native/browser Turbo 1024 same-seed final-output quality gate
        id: native_browser_output_quality
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/burn-image-native-browser-same-seed-output-quality"
          mkdir -p "$output_dir"
          cargo run -p bevy_burn_image --release --locked \
            --features boogu-native \
            --bin burn-image-output-quality -- \
            --native-report "$RUNNER_TEMP/burn-image-native-low-vram-turbo-1024/burn-image-native-low-vram-turbo-1024x1024-report.json" \
            --browser-report "$RUNNER_TEMP/burn-image-rendered-turbo-1024/burn-image-rendered-turbo-1024-report.json" \
            --output "$output_dir/burn-image-native-browser-same-seed-output-quality-report.json" \
            2>&1 | tee "$output_dir/workflow-console.log"

      - name: Upload required release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-release-gpu-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/burn-image-native-low-vram-1k5/*.json
            ${{ runner.temp }}/burn-image-native-low-vram-1k5/*.log
            ${{ runner.temp }}/burn-image-native-low-vram-1k5/*.png
            ${{ runner.temp }}/burn-image-browser-low-vram/*.json
            ${{ runner.temp }}/burn-image-browser-low-vram/*.log
            ${{ runner.temp }}/burn-image-browser-low-vram/*.png
            ${{ runner.temp }}/burn-image-rendered-turbo-1024/*.json
            ${{ runner.temp }}/burn-image-rendered-turbo-1024/*.log
            ${{ runner.temp }}/burn-image-rendered-turbo-1024/*.png
            ${{ runner.temp }}/burn-image-rendered-turbo-1024/downloads/*.png
            ${{ runner.temp }}/burn-image-rendered-turbo-1024-multi-request/*.json
            ${{ runner.temp }}/burn-image-rendered-turbo-1024-multi-request/*.log
            ${{ runner.temp }}/burn-image-rendered-turbo-1024-multi-request/*.png
            ${{ runner.temp }}/burn-image-rendered-turbo-1024-multi-request/downloads/*.png
            ${{ runner.temp }}/burn-image-native-low-vram-turbo-1024/*.json
            ${{ runner.temp }}/burn-image-native-low-vram-turbo-1024/*.log
            ${{ runner.temp }}/burn-image-native-low-vram-turbo-1024/*.png
            ${{ runner.temp }}/burn-image-native-browser-same-seed-output-quality/*.json
            ${{ runner.temp }}/burn-image-native-browser-same-seed-output-quality/*.log
            ${{ runner.temp }}/burn-image-native-browser-same-seed-output-quality/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Require every release qualification gate
        if: always()
        shell: bash
        env:
          NATIVE_LOW_VRAM_OUTCOME: ${{ steps.native_low_vram_1k5.outcome }}
          LOW_VRAM_OUTCOME: ${{ steps.browser_low_vram.outcome }}
          RENDERED_TURBO_OUTCOME: ${{ steps.browser_rendered_turbo_1024.outcome }}
          RENDERED_TURBO_MULTI_REQUEST_OUTCOME: ${{ steps.browser_rendered_turbo_1024_multi_request.outcome }}
          NATIVE_TURBO_OUTPUT_OUTCOME: ${{ steps.native_turbo_1024_output.outcome }}
          NATIVE_BROWSER_OUTPUT_QUALITY_OUTCOME: ${{ steps.native_browser_output_quality.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            NATIVE_LOW_VRAM_OUTCOME \
            LOW_VRAM_OUTCOME \
            RENDERED_TURBO_OUTCOME \
            RENDERED_TURBO_MULTI_REQUEST_OUTCOME \
            NATIVE_TURBO_OUTPUT_OUTCOME \
            NATIVE_BROWSER_OUTPUT_QUALITY_OUTCOME; do
            if [[ "${!gate}" != "success" ]]; then
              echo "required release qualification failed or was skipped: $gate=${!gate}" >&2
              failed=$((failed + 1))
            fi
          done
          if ((failed != 0)); then
            exit 1
          fi
